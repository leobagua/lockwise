# GitLab WithLockRetries::DEFAULT_TIMING_CONFIGURATION, 41 pairs repeated 15 times.
name = "s0-gitlab-ladder"
max_runtime_s = 120

[schedule]
kind = "fixed"
repeat = 15
steps = [
  [100, 50], [100, 50], [200, 50], [300, 100], [400, 150],
  [500, 2000], [500, 2000], [500, 2000], [500, 2000], [1000, 5000], [1000, 15000],
  [100, 50], [100, 50], [200, 50], [300, 100], [400, 150],
  [500, 2000], [500, 2000], [500, 2000], [2000, 15000],
  [100, 50], [100, 50], [500, 2000], [500, 2000], [2000, 15000],
  [500, 500], [500, 500], [2000, 15000],
  [500, 500], [500, 500], [2000, 15000],
  [500, 500], [500, 500], [2000, 15000],
  [100, 50], [100, 50], [500, 2000], [2000, 15000],
  [100, 50], [500, 2000], [2000, 15000],
]
